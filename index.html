<!DOCTYPE html>

<!--
  بداية صفحة HTML.

  lang="en"
  معناها أن لغة الصفحة الأساسية إنجليزية.
-->
<html lang="en">

<head>

  <!--
    تحديد ترميز الحروف.
    UTF-8 يسمح باستخدام العربي والإنجليزي والإيموجي وغيرها.
  -->
  <meta charset="UTF-8" />


  <!--
    مهم جدًا للموبايل.

    يجعل الصفحة تتناسب مع عرض شاشة الهاتف.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <!--
    اسم الموقع الذي يظهر في تبويب المتصفح.
  -->
  <title>Snöcs</title>


  <!-- ==================================================
       Tailwind CSS
       ==================================================

       Tailwind مكتبة CSS تساعد في تصميم الصفحة
       باستخدام Classes جاهزة داخل HTML.

       مثال:

       max-w-md
       px-6
       py-12
       text-center
  -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- ==================================================
       Font Awesome
       ==================================================

       مكتبة الأيقونات.

       هي المسؤولة عن:

       WhatsApp
       Instagram
       Store
       وغيرها.
  -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />


  <!-- ==================================================
       Google Fonts
       ==================================================

       تحميل خط Inter من Google.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />


  <!-- ==================================================
       Tailwind Configuration
       ==================================================

       هنا بنحدد ألوان البراند والخط.
  -->

  <script>

    tailwind.config = {

      theme: {

        extend: {

          colors: {

            /*
              اللون الأخضر الأساسي.
            */

            brandGreen: '#72BA27',


            /*
              اللون الأخضر الداكن للخلفية.
            */

            brandDark: '#1F301F',


            /*
              اللون الأبيض.
            */

            brandWhite: '#FFFFFF',

          },


          /*
            تحديد خط Inter كخط أساسي.
          */

          fontFamily: {

            sans: ['Inter', 'sans-serif'],

          },

        },

      },

    };

  </script>


  <!-- ==================================================
       CSS
       ==================================================

       كل التصميم الخاص بالموقع موجود هنا.

       لا تحتاج ملف CSS خارجي.
  -->

  <style>


    /* ==================================================
       BODY
       ==================================================

       تصميم الصفحة بالكامل.
    */

    body {

      /* لون الخلفية الأساسي */

      background-color: #1F301F;


      /*
        صورة الخلفية.

        يمكنك تغيير الرابط الموجود داخل url()
        إذا أردت صورة أخرى.
      */

      background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000&auto=format&fit=crop');


      /*
        جعل الصورة تغطي الشاشة بالكامل.
      */

      background-size: cover;


      /*
        وضع الصورة في المنتصف.
      */

      background-position: center;


      /*
        تجعل الخلفية ثابتة أثناء Scroll.
      */

      background-attachment: fixed;


      /* لون النص الأساسي */

      color: #FFFFFF;


      /* نوع الخط */

      font-family: 'Inter', sans-serif;


      /* إزالة المسافات الافتراضية */

      margin: 0;

      padding: 0;


      /* أقل ارتفاع للصفحة */

      min-height: 100vh;


      /* تحسين ظهور الخط */

      -webkit-font-smoothing: antialiased;


      /* مهم لبعض العناصر */

      position: relative;

    }


    /* ==================================================
       BACKGROUND BLUR OVERLAY
       ==================================================

       طبقة فوق الخلفية تعمل تأثير Blur وشفافية.
    */

    .bg-blur-overlay {

      /* تثبيت الطبقة على الشاشة */

      position: fixed;


      /* تغطية الشاشة بالكامل */

      top: 0;

      left: 0;

      right: 0;

      bottom: 0;


      /*
        طبقة Gradient خضراء شفافة.
      */

      background: linear-gradient(
        135deg,
        rgba(31, 48, 31, 0.85) 0%,
        rgba(31, 48, 31, 0.6) 100%
      );


      /*
        تأثير Blur قوي.
      */

      backdrop-filter: blur(25px);

      -webkit-backdrop-filter: blur(25px);


      /*
        وضع الطبقة خلف محتوى الموقع.
      */

      z-index: 0;

    }


    /* ==================================================
       SPLASH SCREEN
       ==================================================

       الشاشة التي تظهر لحظة فتح الموقع.
    */

    #splash-screen {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;


      /* لون شاشة البداية */

      background-color: #1F301F;


      /*
        وضع اللوجو في منتصف الشاشة.
      */

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;


      /*
        تجعل Splash فوق كل شيء.
      */

      z-index: 9999;


      /*
        Animation الخاصة بالاختفاء.
      */

      transition:
        opacity 0.6s ease-out,
        visibility 0.6s ease-out;

    }


    /* ==================================================
       SPLASH LOGO
       ================================================== */

    .splash-logo {

      /*
        حجم اللوجو في شاشة البداية.
      */

      width: 250px;

      height: auto;


      /*
        تشغيل Animation اسمها splashPulse.
      */

      animation:
        splashPulse 1.5s infinite ease-in-out;

    }


    /* ==================================================
       SPLASH ANIMATION
       ================================================== */

    @keyframes splashPulse {

      /*
        بداية ونهاية الحركة.
      */

      0%,
      100% {

        transform: scale(1);

        opacity: 0.8;

      }


      /*
        منتصف الحركة.

        اللوجو يكبر قليلًا.
      */

      50% {

        transform: scale(1.12);

        opacity: 1;

      }

    }


    /* ==================================================
       BUTTON DESIGN
       ==================================================

       هذا هو شكل جميع أزرار الروابط.
    */

    .pill-button {

      /*
        خلفية شفافة.
      */

      background: rgba(255, 255, 255, 0.12);


      /*
        Glass Effect.
      */

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);


      /*
        حدود شفافة.
      */

      border: 1px solid rgba(255, 255, 255, 0.15);


      /*
        يجعل الزر دائريًا من الأطراف.
      */

      border-radius: 9999px;


      /*
        سرعة الحركة عند Hover.
      */

      transition:
        all 0.4s cubic-bezier(
          0.25,
          1,
          0.5,
          1
        );


      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;

      cursor: pointer;

    }


    /* ==================================================
       HOVER
       ==================================================

       التأثير عند مرور الماوس على الكمبيوتر.
    */

    @media (hover: hover) {

      .pill-button:hover {

        /*
          الزر يطلع لأعلى قليلًا.
        */

        transform:
          translateY(-4px)
          scale(1.02);


        /*
          زيادة شفافية الخلفية.
        */

        background:
          rgba(255, 255, 255, 0.18);


        /*
          تغيير لون الحدود للأخضر.
        */

        border-color:
          rgba(114, 186, 39, 0.6);


        /*
          Shadow حول الزر.
        */

        box-shadow:
          0 10px 25px -5px
          rgba(31, 48, 31, 0.5),

          0 0 15px
          rgba(114, 186, 39, 0.25);

      }

    }


    /* ==================================================
       TOUCH / CLICK
       ================================================== */

    .pill-button:active {

      /*
        تصغير الزر عند الضغط.
      */

      transform:
        scale(0.96)
        translateY(0);


      background:
        rgba(255, 255, 255, 0.25);


      box-shadow: none;


      transition:
        all 0.1s ease;

    }


    /* ==================================================
       BUTTON MAIN TEXT
       ================================================== */

    .btn-text-primary {

      /*
        لون النص الأساسي.
      */

      color: #72BA27;


      /*
        سمك الخط.
      */

      font-weight: 600;


      line-height: 1.2;

    }


    /* ==================================================
       BUTTON SECONDARY TEXT
       ================================================== */

    .btn-text-secondary {

      /*
        لون الوصف الصغير.
      */

      color:
        rgba(114, 186, 39, 0.75);


      /*
        حجم الخط.
      */

      font-size: 0.75rem;


      /*
        مسافة صغيرة أعلى النص.
      */

      margin-top: 2px;

    }


    /* ==================================================
       ICON
       ================================================== */

    .btn-icon {

      /*
        لون الأيقونة.
      */

      color: #72BA27;


      /*
        حجم الأيقونة.
      */

      font-size: 1.15rem;


      /*
        وضع الأيقونة في المنتصف.
      */

      display: flex;

      align-items: center;

      justify-content: center;


      /*
        حركة الأيقونة.
      */

      transition:
        transform 0.3s ease;

    }


    /* ==================================================
       ICON HOVER
       ================================================== */

    .pill-button:hover .btn-icon {

      /*
        تكبير الأيقونة ولفها قليلًا.
      */

      transform:
        scale(1.15)
        rotate(-5deg);


      /*
        تغيير لون الأيقونة للأبيض.
      */

      color: #FFFFFF;

    }


    /* ==================================================
       MASCOT FLOATING ANIMATION
       ================================================== */

    @keyframes float {

      /*
        بداية الحركة.
      */

      0% {

        transform: translateY(0px);

      }


      /*
        منتصف الحركة.
      */

      50% {

        transform: translateY(-12px);

      }


      /*
        نهاية الحركة.
      */

      100% {

        transform: translateY(0px);

      }

    }


    /*
      تطبيق الحركة على صورة الـ Mascot.
    */

    .mascot-img {

      animation:
        float 6s ease-in-out infinite;

    }


    /* ==================================================
       TITLE ANIMATION
       ================================================== */

    @keyframes titlePulse {

      0% {

        transform: scale(1);

        opacity: 0.9;

        text-shadow:
          0 0 0px
          rgba(114, 186, 39, 0);

      }


      50% {

        transform: scale(1.03);

        opacity: 1;

        text-shadow:
          0 0 15px
          rgba(114, 186, 39, 0.4);

      }


      100% {

        transform: scale(1);

        opacity: 0.9;

        text-shadow:
          0 0 0px
          rgba(114, 186, 39, 0);

      }

    }


    /*
      تطبيق Animation على اسم Aura.
    */

    .animated-title {

      display: inline-block;

      animation:
        titlePulse 4s ease-in-out infinite;

    }

  </style>

</head>


<!-- ==================================================
     BODY
     ==================================================

     كل المحتوى الذي يظهر للمستخدم.
-->

<body
  class="relative flex flex-col items-center min-h-screen selection:bg-brandGreen selection:text-brandDark"
>


  <!-- ==================================================
       SPLASH SCREEN
       ==================================================

       شاشة البداية التي تظهر عند فتح الموقع.
  -->

  <div id="splash-screen">


    <!--
      صورة اللوجو.

      لو عايز تغير اللوجو:
      غيّر الرابط الموجود في src.
    -->

    <img
      src="https://cdn.discordapp.com/attachments/1535432174516310091/1547341843782574190/Logo-removebg-preview_3.png?ex=6aa311e3&is=6aa1c063&hm=d95e9263252a2e3c9ab971be15401bb735887c43cbac9db66558f4d30e4b3f38"

    -->

    <span

    >
      
    </span>

  </div>


  <!-- ==================================================
       BLUR BACKGROUND
       ================================================== -->

  <div class="bg-blur-overlay"></div>


  <!-- ==================================================
       MAIN CONTAINER
       ==================================================

       يحتوي على كل محتوى الموقع.
  -->

  <main
    class="relative z-10 w-full max-w-md mx-auto px-6 py-12 flex flex-col items-center min-h-screen justify-between"
  >


    <!-- ==================================================
         TOP CONTENT
         ================================================== -->

    <div class="w-full flex flex-col items-center">


      <!-- ==================================================
           HEADER
           ================================================== -->

      <div class="text-center w-full mb-8">


        <!--
          Mascot / الصورة الرئيسية.
        -->

        <div class="mb-4 flex justify-center">

          <img
            src="https://cdn.discordapp.com/attachments/1535432174516310091/1547340567816568862/Logo-removebg-preview_1.png?ex=6aa310b3&is=6aa1bf33&hm=f1c786f7a69e56442e4e9bb7536d39772b759fd4674c5125273c46f04e7dd913"
            alt="Snöcs"
            class="w-45 h-auto mascot-img drop-shadow-2xl opacity-95"
          />

        </div>


        <!-- ==================================================
             BRAND NAME
             ==================================================

             اسم Aura.
        -->

        <h1
          class="text-5xl font-extrabold tracking-tight text-brandWhite mb-3 drop-shadow-lg animated-title"
        >
          Snöcs
        </h1>


        <!-- ==================================================
             DESCRIPTION
             ================================================== -->

        <div class="text-center px-2 space-y-1.5 mt-2">


          <!-- الجملة الأولى -->

          <p class="text-lg font-medium text-brandWhite drop-shadow-md">
            Your feet called. They want Snocs. 👣
          </p>


          <!-- الجملة الثانية -->

          <p class="text-[15px] font-medium text-brandWhite/90 drop-shadow-md">
            Slides • Toe Slippers • Socks • Shoes
          </p>


          <!-- الجملة الثالثة -->

          <p class="text-[15px] font-medium text-brandWhite/90 drop-shadow-md">
            Comfort meets everyday style.
          </p>

        </div>

      </div>


      <!-- ==================================================
           LINKS LIST
           ==================================================

           هنا جميع أزرار الروابط.
      -->

      <div class="w-full space-y-4 mt-2">


        <!-- ==================================================
             WHATSAPP BUTTON
             ================================================== -->

        <a
          href="#"
          class="pill-button w-full px-6 py-4 group"
        >


          <!-- أيقونة WhatsApp -->

          <div class="flex-shrink-0 btn-icon w-8">

            <i class="fa-brands fa-whatsapp"></i>

          </div>


          <!-- النص -->

          <div
            class="flex-1 flex flex-col justify-center text-center pr-8"
          >

            <!-- عنوان الزر -->

            <div class="btn-text-primary text-[16px]">
              Aura New Collection - VIP
            </div>

            <div class="btn-text-secondary">

            </div>

          </div>

        </a>


        <!-- ==================================================

             ================================================== -->

        <a

        >


          <!-- أيقونة المتجر -->

          <div class="flex-shrink-0 btn-icon w-8">

            <i class="fa-solid fa-store"></i>

          </div>


          <!-- النص -->

          <div
            class="flex-1 flex flex-col justify-center text-center pr-8"
          >

            <!-- عنوان الزر -->

            <div class="btn-text-primary text-[16px]">
              Shop Official Website
            </div>


            <!-- وصف الزر -->

            <div class="btn-text-secondary">

            </div>

          </div>

        </a>


        <!-- ==================================================
             INSTAGRAM BUTTON
             ================================================== -->

        <a
          href="#"
          class="pill-button w-full px-6 py-4 group"
        >


          <!-- أيقونة Instagram -->

          <div class="flex-shrink-0 btn-icon w-8">

          </div>


          <!-- النص -->

          <div
            class="flex-1 flex flex-col justify-center text-center pr-8"
          >

      </div>

    </div>


    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer class="mt-12 pb-4 w-full text-center">


      <!--
        اسم المطور.
      -->

      <span
        class="text-[11px] font-bold tracking-widest text-brandWhite/70 uppercase"
      >
        DEV BY ZEYAD
      </span>

    </footer>


  </main>


  <!-- ==================================================
       JAVASCRIPT
       ==================================================

       مسؤول عن إخفاء شاشة البداية بعد تحميل الموقع.
  -->

  <script>


    /*
      انتظار انتهاء تحميل الصفحة بالكامل.
    */

    window.addEventListener('load', function() {


      /*
        العثور على Splash Screen.
      */

      const splash =
        document.getElementById('splash-screen');


      /*
        انتظار 400ms ثم إخفاء الشاشة.
      */

      setTimeout(() => {


        /*
          جعل الشفافية صفر.
        */

        splash.style.opacity = '0';


        /*
          إخفاء العنصر.
        */

        splash.style.visibility = 'hidden';


      }, 400);

    });

  </script>


</body>

</html>
